<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>Les petits plats</title>

  <script src="https://kit.fontawesome.com/14273d579a.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Shrikhand&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="position-relative">
    <div class="container-fluid p-0 px-0 bandeau">
      <img src="./img/Mask-group.png" alt="image d'introduction" class="img-fluid w-100 h-100 object-cover">
      <!-- Overlay noir -->
      <div class="position-absolute top-0 start-0 w-100 h-100 overlay">
        <img src="./img/Logo.png" alt="logo les petits plats" class="m-5">
      </div>
      <div class="title">
        <h1>CHERCHEZ PARMI PLUS DE 1500 RECETTES DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES</h1>
      </div>
      <div class="searchBar">
        <div class="container">
          <form role="search" onsubmit="return false;">
            <div class="position-relative searchContainer">
              <input id="searchInput" class="form-control pe-5 searchInput" type="search"
                placeholder="Rechercher une recette, un ingrédient,..." aria-label="Recherche">
              <button type="button" id="clearButton" class="clear-btn">✕</button>
              <button type="submit" class="submitMainButton">
                <img src="./img/loupe.png" alt="bouton rechercher" class="loupe-img">
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </header>


  <main>

    <!--SECTION DES FILTRES-->
    <section>
      <div class="container d-flex justify-content-between mx-9">
        <div class="filter d-flex flex-wrap gap-5 py-4">

          <!--Premier filtre -->
          <div class="dropdown" id='firstDropdown'>
            <button class="dropdown-button" aria-expanded="false">Ingrédients
              <i class="bi bi-chevron-down ms-2"></i>
            </button>
            <div class="dropdown-menu">
              <form role="search" class="dropdownForm" autocomplete="off">
                <div class="position-relative searchingDropdownContainer">
                  <input id="searchIngredientsInput" class="form-control pe-5 dropdownInput" type="search"
                    placeholder="" aria-label="Recherche">
                  <button type="button" class="clearInput-btn">✕</button>
                  <button type="submit" class="submitInputButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </button>
                </div>
              </form>
              <ul class="dropdown-list" id="ingredientsDropdownList"></ul>
            </div>
          </div>

          <!---Deuxième filtre -->
          <div class="dropdown" id='secondDropdown'>
            <button class="dropdown-button">
              Appareils
              <i class="bi bi-chevron-down ms-2"></i>
            </button>
            <div class="dropdown-menu">
              <form role="search" class="dropdownForm">
                <div class="position-relative searchingDropdownContainer">
                  <input id="searchAppliancesInput" class="form-control pe-5 dropdownInput" type="search" placeholder=""
                    aria-label="Recherche">
                  <button type="button" class="clearInput-btn">✕</button>
                  <button type="submit" class="submitInputButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </button>
                </div>
              </form>
              <ul class="dropdown-list" id="appliancesDropdownList">
              </ul>
            </div>
          </div>

          <!--Troisième filtre -->
          <div class="dropdown" id="thirdDropdown">
            <button class="dropdown-button">
              Ustensiles
              <i class="bi bi-chevron-down ms-2"></i>
            </button>
            <div class="dropdown-menu">
              <form role="search" class="dropdownForm">
                <div class="position-relative searchingDropdownContainer">
                  <input id="searchUstensilsInput" class="form-control pe-5 dropdownInput" type="search" placeholder=""
                    aria-label="Recherche">
                  <button type="button" class="clearInput-btn">✕</button>
                  <button type="submit" class="submitInputButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </button>
                </div>
              </form>
              <ul class="dropdown-list" id="ustensilsDropdownList">
              </ul>
            </div>

          </div>
        </div>

        <div class="totalRecipes py-4">
          <div id="recipeCount" class="total-recipes-text"></div>

        </div>
      </div>
      <div id="selected-tags-container" class="container mx-9 d-flex flex-wrap gap-3 selected-tags-container">
      </div>
    </section>

    <!--SECTION DES PROPOSITIONS DE RECETTES-->
    <section>
      <div class=" container recipes-container d-flex flex-wrap justify-content-between mx-9">
        <div class="errorMessage-container"></div>
      </div>
    </section>
  </main>
  <footer>

  </footer>
  <script src="JSON-recipes/recipes.js"></script>
  <script src="recipesTemplate.js"></script>
  <script src="script.js"></script>

</body>

</html>
